[project]
name = "embodied-fps-agent"
version = "0.1.0"
description = "A MuJoCo robotic arm physically moves a mouse and clicks to play an FPS shooting range from screen images"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco",
    "numpy",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
    "anthropic>=2.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_fps_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
